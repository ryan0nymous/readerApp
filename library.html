<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
<title>LIBRARY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.25/jsrsasign-all-min.js"></script>
<style>
  :root {
    --bg: #0e0d0b; --surface: #161410; --border: #2a2620; --text: #e8e0d0; --muted: #6b6358;
    --accent: #c9a84c; --accent-red: #ff6b6b; --accent-green: #51cf66; --reader-bg: #f5f0e8; --reader-text: #1a1610;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px; min-height: 100vh; overflow-x: hidden; }

  #auth-screen { display: block; min-height: 100vh; text-align: center; padding: 15vh 2rem 5vh; }
  .auth-title { font-family: 'Playfair Display', serif; font-size: 50px; font-weight: 700; color: var(--accent); margin-bottom: 0.5rem; }
  .auth-subtitle { color: var(--muted); font-size: 10px; text-transform: uppercase; margin-bottom: 3rem; letter-spacing: 0.3em; }

  #app { display: none; min-height: 100vh; }
  header { display: block; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); position: relative; background: var(--bg); z-index: 100; overflow: hidden; }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--accent); letter-spacing: 0.2em; float: left; }
  #search { float: right; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.8rem; width: 200px; outline: none; }

  .filter-bar { display: block; padding: 0.7rem 1.5rem; border-bottom: 1px solid var(--border); clear: both; overflow: hidden; }
  .filter-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 10px; padding: 0.3rem 0.8rem; cursor: pointer; text-transform: uppercase; margin-right: 0.5rem; float: left; }
  .filter-btn.active { color: var(--accent); border-color: var(--accent); }

  #book-list { padding: 1.5rem; display: block; font-size: 0; }
  .book-card { display: inline-block; width: 150px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; margin-right: 1.5rem; margin-bottom: 1.5rem; vertical-align: top; font-size: 13px; }
  .book-cover { width: 100%; height: 220px; background: var(--bg); position: relative; overflow: hidden; }
  .book-cover img { width: 100%; height: 100%; display: block; border: 0; }
  .book-info { padding: 0.8rem; }
  .book-title { font-family: 'Playfair Display', serif; font-size: 11px; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-author { color: var(--muted); font-size: 9px; }

  /* ── READER ── */
  #reader-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: #f5f0e8; z-index: 10000; overflow: hidden; }
  #epub-content-area { position: absolute; top: 50px; bottom: 0; left: 0; right: 0; overflow: hidden; background: #f5f0e8; }
  #epub-container { position: absolute; top: 20px; bottom: 20px; left: 20px; width: 700px; -webkit-column-gap: 40px; column-gap: 40px; -webkit-column-fill: auto; column-fill: auto; color: #1a1610; font-family: 'PT Serif', Georgia, serif; font-size: 17px; line-height: 1.6; word-wrap: break-word; }
  #epub-container img, #epub-container svg { height: auto; -webkit-column-break-inside: avoid; }
  #reader-status { display: none; position: absolute; top: 50px; left: 0; right: 0; bottom: 0; z-index: 5; text-align: center; padding: 20vh 2rem 0; color: #6b6358; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.6; background: #f5f0e8; }
  
  #error-monitor { color: #ff6b6b; font-size: 10px; text-align: left; padding: 1rem; border: 1px dashed #ff6b6b; display: none; margin: 2rem auto; max-width: 360px; word-break: break-all; }
  .ctrl-btn { background: #fdfcf9; border: 1px solid #c4bdb0; color: #4a443a; font-size: 11px; padding: 0.5rem 1rem; cursor: pointer; display: inline-block; text-decoration: none; border-radius: 4px; font-weight: bold; }
  .btn-accent { background: var(--accent) !important; color: var(--bg) !important; border: none !important; }

  .book-card { position: relative; z-index: 9000; pointer-events: auto !important; color: var(--text); }
  .cover-placeholder { padding: 1.5rem; text-align: center; height: 100%; color: var(--muted); font-size: 11px; }
  .format-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); padding: 2px 5px; font-size: 9px; color: var(--text); }
  .book-cover img { transition: opacity 0.3s; }
  .empty-msg { padding: 4rem; text-align: center; color: var(--muted); }
  body.in-app #tools { display: none; }
  body.in-app.show-tools #tools { display: block; }
  .toc-item { display: block; padding: 8px 5px; border-bottom: 1px solid #ede8e0; color: #4a443a; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  #epub-container a { color: inherit; }
  #view-bar { padding: 0.5rem 1.5rem 0; overflow: hidden; border-bottom: 1px solid var(--border); }
  .view-btn { float: left; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: inherit; font-size: 11px; padding: 0.6rem 0.9rem; margin-right: 0.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; }
  .view-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  #letter-bar { display: none; padding: 0.5rem 1.5rem 0; overflow: hidden; }
  #letter-list { float: left; font-size: 0; }
  .letter { display: inline-block; font-size: 11px; color: var(--muted); padding: 6px 7px; cursor: pointer; }
  .letter.active { color: var(--accent); font-weight: bold; }
  #sort-sel { float: right; background: var(--surface); color: var(--text); border: 1px solid var(--border); font-family: inherit; font-size: 11px; padding: 4px; }
  #drill-bar { display: none; padding: 0.7rem 1.5rem 0; }
  #drill-title { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--accent); margin: 0 1rem; }
  #panel { display: none; padding: 1.5rem; }
  .pnl-h { color: var(--accent); font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; margin: 1.6rem 0 0.8rem; }
  .chip { display: inline-block; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; margin: 0 8px 8px 0; font-size: 11px; cursor: pointer; border-radius: 14px; }
  .chip b { color: var(--muted); font-weight: normal; margin-left: 6px; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip-new { border-style: dashed; color: var(--muted); }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.6; margin-bottom: 0.8rem; }
  .row-scroll { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; font-size: 0; padding-bottom: 6px; }
  .hero { overflow: hidden; margin-top: 1rem; }
  .hero-cover { float: left; margin-right: 1.5rem; width: 150px; }
  .hero-cover .book-card { margin: 0; }
  .hero-text { overflow: hidden; }
  .hero-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text); line-height: 1.3; }
  .hero-author { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .hero-desc { color: #b8b0a0; font-size: 12px; line-height: 1.7; }
  .info-btn { position: absolute; top: 5px; left: 5px; width: 22px; height: 22px; line-height: 22px; text-align: center; background: rgba(0,0,0,0.8); border-radius: 11px; color: var(--accent); font-size: 13px; cursor: pointer; z-index: 2; }
  .pct-badge { position: absolute; bottom: 5px; left: 5px; background: var(--accent); color: var(--bg); padding: 2px 6px; font-size: 10px; font-weight: bold; }
  .fav-mark { position: absolute; bottom: 5px; right: 5px; color: var(--accent); font-size: 16px; text-shadow: 0 0 3px #000; }
  #detail { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); z-index: 9999; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #detail-box { max-width: 560px; margin: 5vh auto; background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; }
  .detail-cover { float: left; width: 110px; min-height: 10px; margin-right: 1.2rem; }
  .detail-cover img { width: 100%; display: block; }
  .detail-head { overflow: hidden; }
  #loading { display: none; text-align: center; padding: 4rem; }
  .spinner { display: inline-block; width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; -webkit-animation: spin 0.8s linear infinite; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
window.onerror = function(msg, url, line) {
  var m = document.getElementById('error-monitor');
  if (m) { m.style.display = 'block'; m.innerHTML += '<div>Line ' + line + ': ' + msg + '</div>'; }
};
</script>
</head>
<body>

<div id="auth-screen">
  <div class="auth-title">LIBRARY</div>
  <div class="auth-subtitle">Service Account Access</div>
  
  <div id="pin-container">
    <input type="password" pattern="[0-9]*" inputmode="numeric" id="pin-input" onkeydown="if(event.keyCode===13)unlockApp()" placeholder="PIN" style="font-size: 24px; text-align: center; letter-spacing: 0.5em; width: 200px; padding: 10px; background: #000; border: 1px solid var(--border); color: var(--text); border-radius: 4px; margin-bottom: 20px;">
    <br>
    <button class="ctrl-btn btn-accent" style="padding: 1rem 3rem; font-size: 16px;" onclick="unlockApp()">Unlock</button>
  </div>

  <div id="auth-loading" style="display:none; color: var(--accent); margin-top: 2rem; font-size: 16px;">
    <div class="spinner" style="margin-bottom: 1rem;"></div><br>
    Connecting to Vault...
  </div>

  <div id="error-monitor"></div>
</div>

<div id="app">
  <header>
    <div class="logo">LIBRARY</div>
    <input type="search" id="search" placeholder="search..." oninput="debouncedFilter()">
  </header>
  <div id="view-bar">
    <button class="view-btn active" data-v="library" onclick="setView('library')">Library</button>
    <button class="view-btn" data-v="recent" onclick="setView('recent')">Recent</button>
    <button class="view-btn" data-v="favorites" onclick="setView('favorites')">★ Favorites</button>
    <button class="view-btn" data-v="shelves" onclick="setView('shelves')">Shelves</button>
    <button class="view-btn" data-v="discover" onclick="setView('discover')">Discover</button>
  </div>
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('epub', this)">ePub</button>
    <button class="filter-btn" onclick="setFilter('pdf', this)">PDF</button>
    <button class="ctrl-btn" style="float:right; border:none; opacity:0.6; margin-left: 5px;" onclick="loadLibrary(true)">⟲</button>
    <button class="ctrl-btn" style="float:right; border:none; opacity:0.6;" onclick="toggleTools()">⚙</button>
    <span style="color:var(--muted); font-size:10px; float:right; margin-right: 1.5rem; margin-top:5px;" id="book-count"></span>
  </div>
  <div id="letter-bar">
    <div id="letter-list"></div>
    <select id="sort-sel" onchange="setSort(this.value)"><option value="title">Sort: Title</option><option value="author">Sort: Author</option></select>
  </div>
  <div id="drill-bar">
    <button class="ctrl-btn" onclick="closeDrill()">← Back</button><span id="drill-title"></span>
    <button class="ctrl-btn" id="drill-del" onclick="deleteDrillShelf()" style="display:none;">Delete shelf</button>
  </div>
  <div id="loading"><div class="spinner"></div></div>
  <div id="panel"></div>
  <div id="book-list"></div>
</div>

<div id="tools">
<div id="repair-kit" style="margin: 2rem auto; max-width: 360px; padding: 1.5rem; background: #1a1814; border: 1px solid var(--border); border-radius: 8px; font-size: 11px; color: var(--muted); display: block;">
  <h3 style="color: var(--accent); margin-bottom: 1rem; text-transform: uppercase;">Repair & Sync</h3>
  
  <div style="margin-bottom: 1.5rem;">
    <p style="margin-bottom: 0.5rem;">1. Fallback Login (Laptop Only)</p>
    <button class="ctrl-btn" onclick="startAuth()" style="width: 100%; padding: 10px; background: #4285f4; color: white; border: none; border-radius: 4px; font-weight: bold;">Connect Google Drive</button>
  </div>

  <div style="margin-bottom: 1.5rem; border-top: 1px solid #332d24; padding-top: 1rem;">
    <p style="margin-bottom: 0.5rem;">2. Magic Sync to iPad</p>
    <div id="sync-display" style="display:none; background: #000; padding:10px; margin-bottom:10px; text-align:center;">
      Code: <span id="sync-code-val" style="font-size:24px; color:var(--accent); font-weight:bold; letter-spacing:4px;">----</span>
    </div>
    <button class="ctrl-btn" onclick="generateSyncCode()" id="gen-sync-btn" style="width: 100%;">Get iPad Sync ID</button>
    <div style="margin-top:10px; display:flex; gap:5px;">
      <input type="text" id="sync-input" placeholder="Type 4-letter ID" style="flex:1; background:#000; color:#fff; border:1px solid #333; padding:5px; text-transform:uppercase;">
      <button class="ctrl-btn" onclick="useSyncCode()">SyncNow</button>
    </div>
  </div>

  <div style="border-top: 1px solid #332d24; padding-top: 1rem;">
    <p style="margin-bottom: 0.5rem;">3. Update Credentials (Paste JSON)</p>
    <textarea id="json-repair" placeholder="Paste your Google Service Account JSON here..." style="width: 100%; height: 60px; background: #000; color: #51cf66; border: 1px solid #333; font-family: monospace; font-size: 9px; padding: 5px;"></textarea>
    <button class="ctrl-btn" onclick="applyRepair()" style="width:100%; margin-top:5px; border-color: var(--accent-green);">Apply New Credentials</button>
  </div>
  <div style="border-top: 1px solid #332d24; padding-top: 1rem; margin-top: 1rem;">
    <p style="margin-bottom: 0.5rem;">4. Covers</p>
    <button class="ctrl-btn" onclick="backfillCovers()" style="width:100%;">Fetch missing ePub covers</button>
    <button class="ctrl-btn" onclick="fetchBookInfo()" style="width:100%; margin-top:6px;">Fetch book info (tags, series, descriptions)</button>
  </div>
  <div id="auth-status" style="margin-top: 10px; color: var(--accent-red); font-weight: bold;"></div>
</div>

<div id="diag-panel" style="margin: 2rem auto; max-width: 360px; text-align: left; background: #1a1814; border: 1px solid #332d24; padding: 1rem; color: #887e6a; font-family: monospace; font-size: 9px;">
  <div style="display:flex; justify-content:space-between; margin-bottom:5px; border-bottom:1px solid #332d24;">
    <span style="color:var(--accent); text-transform: uppercase;">Surveillance Board</span>
    <button onclick="localStorage.removeItem('reader_library_cache'); location.reload();" style="background:none; border:none; color:var(--accent-red); cursor:pointer; font-size:9px;">[FORCE RESET]</button>
  </div>
  <div id="diag-lines">
    <div>typeof Promise: <span id="st-promise">...</span></div>
    <div>System Time: <span id="st-time">...</span></div>
    <div id="diag-status" style="margin-top:0.5rem; color:var(--accent); font-weight:bold;">READY - Enter PIN above.</div>
    <div style="margin-top:5px;"><button onclick="diagLog('TEST CLICK OK', 'lime')" style="font-size:9px; background:#444; color:#fff; border:none; padding:2px 5px; cursor:pointer;">[TEST CLICK]</button></div>
    <div id="diag-log" style="height:80px; overflow-y:auto; margin-top:5px; color:#aaa; border-top:1px solid #222; padding-top:5px;"></div>
  </div>
</div>
</div>

<div id="detail" onclick="if(event.target===this)closeDetail()"><div id="detail-box"></div></div>

<div id="reader-overlay">
  <div style="height:50px; background:#ede8e0; border-bottom:1px solid #d4cdc0; padding:10px; display:flex; align-items:center;">
     <button class="ctrl-btn" onclick="closeReader()" style="margin-right:1rem;">✕ Close</button>
     <button class="ctrl-btn" id="toc-btn" onclick="toggleToc()" style="margin-right:1rem; padding:4px 8px; font-weight:bold; display:none;">☰ TOC</button>
     <button class="ctrl-btn" id="fav-btn" onclick="toggleFav(currentBookId)" style="margin-right:0.5rem; padding:4px 8px;">☆</button>
     <button class="ctrl-btn" onclick="changeFontSize(-1)" style="margin-right:0.5rem; padding:4px 8px;">A−</button>
     <button class="ctrl-btn" onclick="changeFontSize(1)" style="margin-right:1rem; padding:4px 8px;">A+</button>
     <span id="reader-progress" style="margin-right:1rem; font-family:'IBM Plex Mono', monospace; font-size:10px; color:#6b6358;"></span>
     <span id="reader-title" style="font-family:'Playfair Display', serif; font-size:13px; color:#1a1610; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;"></span>
  </div>
  <div id="toc-panel" style="display:none; position:absolute; top:50px; left:0; width:300px; height:calc(100% - 50px); background:#fdfcf9; border-right:1px solid #c4bdb0; z-index:20000; overflow-y:auto; -webkit-overflow-scrolling:touch; box-shadow: 2px 0 5px rgba(0,0,0,0.1);"></div>
  <iframe id="pdf-frame" style="position: absolute; top: 50px; bottom: 0; left: 0; right: 0; width: 100%; height: calc(100% - 50px); border: none; display: none;"></iframe>
  <div id="epub-content-area"><div id="epub-container" lang="en"></div></div>
  <div id="reader-status"></div>
  <style id="dyn-style"></style>
</div>

<script>
function diagLog(msg, color) {
    var d = document.getElementById('diag-status');
    if (d) { d.innerText = msg; if (color) d.style.color = color; }
    var l = document.getElementById('diag-log');
    if (l) {
        var div = document.createElement('div');
        div.innerText = "> " + msg;
        if (color) div.style.color = color;
        l.appendChild(div);
        while (l.childNodes.length > 200) l.removeChild(l.firstChild);
        l.scrollTop = l.scrollHeight;
    }
    console.log("DIAG: " + msg);
}
setInterval(function() {
    if (document.hidden || document.body.className.indexOf('in-app') !== -1) return;
    var st = document.getElementById('st-time');
    if (st) st.innerText = new Date().toISOString().split('.')[0] + 'Z';
}, 1000);
document.getElementById('st-promise').innerText = typeof Promise;

// ── INDEXEDDB (covers + offline books) ──
var idb = null, idbWaiters = [], idbDone = false;
function idbFlush() { idbDone = true; var w = idbWaiters; idbWaiters = []; for (var i = 0; i < w.length; i++) w[i](); }
function whenIdb(fn) { if (idbDone) fn(); else idbWaiters.push(fn); }
try {
    var dbReq = indexedDB.open("ReaderCovers", 3);
    dbReq.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("covers")) db.createObjectStore("covers");
        if (!db.objectStoreNames.contains("books")) db.createObjectStore("books");
        if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
    };
    dbReq.onsuccess = function(e) { idb = e.target.result; idbFlush(); };
    dbReq.onerror = function() { idbFlush(); };
    dbReq.onblocked = function() { idbFlush(); };
} catch(e) { idbFlush(); }

function idbGet(store, key, cb) {
    whenIdb(function() {
        if (!idb) return cb(null);
        try {
            var req = idb.transaction(store).objectStore(store).get(key);
            req.onsuccess = function() { cb(req.result || null); };
            req.onerror = function() { cb(null); };
        } catch(e) { cb(null); }
    });
}
function idbPut(store, key, val) {
    whenIdb(function() { if (!idb) return; try { idb.transaction(store, "readwrite").objectStore(store).put(val, key); } catch(e) {} });
}
function idbDelete(store, key) {
    whenIdb(function() { if (!idb) return; try { idb.transaction(store, "readwrite").objectStore(store).delete(key); } catch(e) {} });
}
function saveLocalCover(id, dataUrl) { idbPut("covers", id, dataUrl); }
function getLocalCover(id, cb) { idbGet("covers", id, cb); }

// Offline book cache: ArrayBuffers in IDB, recency list in localStorage
function bookIndex() { try { return JSON.parse(lsGet('reader_book_index') || '[]'); } catch(e) { return []; } }
function touchBookIndex(id) {
    var idx = bookIndex(), out = [id];
    for (var i = 0; i < idx.length; i++) if (idx[i] !== id) out.push(idx[i]);
    while (out.length > BOOK_CACHE_MAX) idbDelete("books", out.pop());
    lsSet('reader_book_index', JSON.stringify(out));
}
function getCachedBook(id, cb) {
    idbGet("books", id, function(buf) { if (buf) touchBookIndex(id); cb(buf); });
}
function saveCachedBook(id, buf) {
    if (!buf || buf.byteLength > BOOK_CACHE_MAX_BYTES) return;
    idbPut("books", id, buf);
    touchBookIndex(id);
}
// Downscale a data URL cover so the cache / DOM stay small
function shrinkCover(dataUrl, cb) {
    try {
        var img = new Image();
        img.onload = function() {
            try {
                if (img.width <= COVER_MAX_WIDTH) { cb(dataUrl); return; }
                var c = document.createElement('canvas');
                c.width = COVER_MAX_WIDTH; c.height = Math.round(img.height * COVER_MAX_WIDTH / img.width);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                cb(c.toDataURL('image/jpeg', 0.82));
            } catch(e) { cb(dataUrl); }
        };
        img.onerror = function() { cb(dataUrl); };
        img.src = dataUrl;
    } catch(e) { cb(dataUrl); }
}

function safeDecode(s) { try { return decodeURIComponent(s); } catch(e) { return s; } }
function normPath(p) {
    var out = [], s = p.split('/');
    for (var i = 0; i < s.length; i++) {
        if (s[i] === '..') out.pop();
        else if (s[i] !== '.' && s[i] !== '') out.push(s[i]);
    }
    return out.join('/');
}
function dirOf(p) { return p.indexOf('/') !== -1 ? p.substring(0, p.lastIndexOf('/') + 1) : ''; }
// resolve `rel` (may carry #hash) against the zip path of the file it appears in
function resolveHref(baseFile, rel) {
    var h = rel.indexOf('#'), hash = h !== -1 ? rel.substring(h) : '', path = h !== -1 ? rel.substring(0, h) : rel;
    if (!path) return normPath(baseFile) + hash;
    return normPath(dirOf(baseFile) + safeDecode(path)) + hash;
}

// ── AUTH ──
var tokenWaiters = [], tokenPending = false;
function flushTokenWaiters() { var w = tokenWaiters; tokenWaiters = []; for (var i = 0; i < w.length; i++) w[i](); }

function fetchServiceToken(callback) {
    if (accessToken && Date.now() < tokenExpiry - (5 * 60 * 1000)) { if (callback) callback(); return; }
    if (!SERVICE_ACCOUNT_EMAIL || SERVICE_ACCOUNT_EMAIL.indexOf('YOUR_') !== -1) { alert("Please configure Service Account credentials in the HTML file."); return; }
    if (typeof KJUR === 'undefined') { diagLog("JWT Error: Library failed to load.", "red"); alert("Cryptography library (jsrsasign) failed to load."); return; }

    // many callers (covers, chapters...) can ask at once: share one token exchange
    if (callback) tokenWaiters.push(callback);
    if (tokenPending) return;
    tokenPending = true;
    var fail = function() { tokenPending = false; tokenWaiters = []; };

    try {
        var cleanKey = SERVICE_ACCOUNT_PRIVATE_KEY.replace(/\\n/g, '\n').replace(/\r/g, '');
        var prk = KEYUTIL.getKey(cleanKey);
        diagLog("Auth: Key Ready. Signing...");

        var now = Math.floor(Date.now() / 1000) - 10;
        var exp = now + 3600;
        var sHeader = '{"alg":"RS256","typ":"JWT"}';
        var sPayload = '{"iss":"' + SERVICE_ACCOUNT_EMAIL + '","scope":"https://www.googleapis.com/auth/drive","aud":"https://oauth2.googleapis.com/token","exp":' + exp + ',"iat":' + now + '}';
        var jwt = KJUR.jws.JWS.sign("RS256", sHeader, sPayload, prk);
        diagLog("Auth: JWT Built. Exchanging...");

        xhr({
            url: 'https://oauth2.googleapis.com/token',
            method: 'POST',
            body: 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=' + jwt,
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            json: true,
            success: function(res) {
                if (res.access_token) {
                    diagLog("Auth: SUCCESS! Token Received.", "lime");
                    accessToken = res.access_token;
                    tokenExpiry = Date.now() + (res.expires_in * 1000);
                    tokenPending = false;
                    flushTokenWaiters();
                } else {
                    diagLog("Auth: FAILED. " + (res.error_description || res.error), "red");
                    fail();
                }
            },
            error: function(status) { diagLog("Auth: Connection Error " + status, "red"); fail(); }
        });
    } catch (err) {
        diagLog("JWT Build Error: " + err, "red");
        fail();
    }
}

// Authorised Drive call. Shares one token exchange; retries a 401 once and
// network / 429 / 5xx failures a few times with backoff.
function apiRequest(opt) {
    fetchServiceToken(function() {
        var o = {}, k;
        for (k in opt) o[k] = opt[k];
        o.headers = {};
        if (opt.headers) for (k in opt.headers) o.headers[k] = opt.headers[k];
        o.headers.Authorization = 'Bearer ' + accessToken;
        if (!o.timeout) o.timeout = 60000;
        o.error = function(s, b) {
            if (s === 401 && !opt._authRetried) { opt._authRetried = true; accessToken = null; tokenExpiry = 0; apiRequest(opt); return; }
            if ((s === 0 || s === 429 || s >= 500 || (s === 403 && /rateLimit/i.test(b || ''))) && (opt._retries || 0) < 3) {
                opt._retries = (opt._retries || 0) + 1;
                setTimeout(function() { apiRequest(opt); }, 700 * opt._retries * opt._retries);
                return;
            }
            if (opt.error) opt.error(s, b);
        };
        xhr(o);
    });
}

function xhr(opt) {
  var x = new XMLHttpRequest();
  x.open(opt.method || 'GET', opt.url);
  if (opt.timeout) x.timeout = opt.timeout;
  if (opt.headers) { for (var h in opt.headers) x.setRequestHeader(h, opt.headers[h]); }
  if (opt.responseType) x.responseType = opt.responseType;
  if (opt.onprogress) x.onprogress = function(e) { opt.onprogress(e.loaded, e.lengthComputable ? e.total : 0); };
  x.onreadystatechange = function() {
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300) {
      var res = x.response;
      try { if (opt.json && typeof res === 'string') res = JSON.parse(res); } catch(e) { if (opt.error) opt.error(x.status, 'bad json'); return; }
      if (opt.success) opt.success(res);
    } else {
      var txt = '';
      try { txt = x.responseText; } catch(e) {}      // throws for blob/arraybuffer responses
      if (opt.error) opt.error(x.status, txt);
    }
  };
  x.send(opt.body);
}

function loadLibrary(force) {
  var loading = document.getElementById('loading');
  var cached = !force && readLibraryCache();
  if (cached) { allBooks = cached; applyFilters(); diagLog("Library: Loaded " + cached.length + " books from cache.", "lime"); return; }

  if (!allBooks.length) loading.style.display = 'block';
  diagLog("Library: Searching for folder '" + FOLDER_NAME + "'...");

  apiRequest({
    url: 'https://www.googleapis.com/drive/v3/files?q=name%3D%27' + encodeURIComponent(FOLDER_NAME) + '%27%20and%20mimeType%3D%27application%2Fvnd.google-apps.folder%27%20and%20trashed%3Dfalse&fields=files(id,name)',
    json: true,
    success: function(data) {
      if (!data.files || !data.files[0]) {
          diagLog("Library Error: FOLDER '" + FOLDER_NAME + "' NOT FOUND. Check sharing.", "orange");
          loading.style.display='none'; return;
      }
      diagLog("Library: Root found. Checking for FastScan...");
      var rootId = data.files[0].id;

      // FastScan: every book + every cover.jpg in two paginated queries
      var qBooks = "trashed = false and (mimeType = 'application/pdf' or mimeType = 'application/epub+zip')";
      var allBooksFound = [];
      var coverMap = {};

      var fetchBooks = function(pageToken) {
          var url = 'https://www.googleapis.com/drive/v3/files?pageSize=1000&fields=nextPageToken,files(id,name,parents,thumbnailLink)&q=' + encodeURIComponent(qBooks);
          if (pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
          apiRequest({
            url: url,
            json: true,
            success: function(bookResp) {
                allBooksFound = allBooksFound.concat(bookResp.files || []);
                if (bookResp.nextPageToken) fetchBooks(bookResp.nextPageToken);
                else fetchCovers();
            },
            error: function() { startDeepScan(rootId); }
          });
      };

      var fetchCovers = function(pageToken) {
          var qCovers = "trashed = false and name = 'cover.jpg'";
          var url = 'https://www.googleapis.com/drive/v3/files?pageSize=1000&fields=nextPageToken,files(id,parents)&q=' + encodeURIComponent(qCovers);
          if (pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
          apiRequest({
            url: url,
            json: true,
            success: function(coverResp) {
                var covers = coverResp.files || [];
                for (var c=0; c<covers.length; c++) {
                    if (covers[c].parents && covers[c].parents[0]) coverMap[covers[c].parents[0]] = covers[c].id;
                }
                if (coverResp.nextPageToken) fetchCovers(coverResp.nextPageToken);
                else fetchOpfs();
            },
            error: function() { fetchOpfs(); }
          });
      };

      var opfMap = {};
      var fetchOpfs = function(pageToken) {
          var url = 'https://www.googleapis.com/drive/v3/files?pageSize=1000&fields=nextPageToken,files(id,parents)&q=' + encodeURIComponent("trashed = false and name = 'metadata.opf'");
          if (pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
          apiRequest({
            url: url,
            json: true,
            success: function(r) {
                var fl = r.files || [];
                for (var c=0; c<fl.length; c++) if (fl[c].parents && fl[c].parents[0]) opfMap[fl[c].parents[0]] = fl[c].id;
                if (r.nextPageToken) fetchOpfs(r.nextPageToken); else finalizeMerge();
            },
            error: function() { finalizeMerge(); }
          });
      };

      var finalizeMerge = function() {
            if (allBooksFound.length < 5) { startDeepScan(rootId); return; }
            diagLog("Library: FastScan MERGED. Found " + allBooksFound.length + " books.", "lime");
            var nb = [];
            for (var i=0; i<allBooksFound.length; i++) {
                var f = allBooksFound[i];
                var parentId = (f.parents && f.parents[0]) || null;
                nb.push(makeBook(f, coverMap[parentId], opfMap[parentId]));
            }
            finishScan(nb);
      };

      fetchBooks();
    },
    error: function() { diagLog("Drive API Error", "red"); loading.style.display='none'; }
  });
}

function makeBook(f, coverId, metaId) {

  seenFolders[fid] = true;

  if (foldersScanned % 10 === 0) diagLog("Library: Scanning folder #" + foldersScanned + "...");

  apiRequest({
    url: 'https://www.googleapis.com/drive/v3/files?q=%27' + fid + '%27%20in%20parents%20and%20trashed%3Dfalse&fields=files(id,name,mimeType,thumbnailLink)&pageSize=1000',
    json: true,
    success: function(data) {
      var items = data.files || [];
      var books = []; var folders = []; var coverId = null; var metaId = null;
      for (var i=0; i<items.length; i++) {
          var nm = items[i].name ? items[i].name.toLowerCase() : '';
          if (nm === 'cover.jpg') coverId = items[i].id;
          else if (nm === 'metadata.opf') metaId = items[i].id;

    }
    var flat = function(o, min) {
        var a = [];
        for (var k in o) if (has(o, k) && o[k].c >= min) a.push(o[k]);
        a.sort(function(x, y) { return y.c - x.c || (x.n.toLowerCase() < y.n.toLowerCase() ? -1 : 1); });
        return a;
    };
    facetCache = { tags: flat(tags, 1), series: flat(series, 2), authors: flat(authors, 2) };
    return facetCache;
}

// ── VIEWS ──
var view = 'library', drill = null, activeLetter = '', sortBy = 'title', moreOpen = {}, discoverState = null, detailId = null;
try { var sb = lsGet('reader_sort'); if (sb === 'author' || sb === 'title') sortBy = sb; } catch(e) {}

function isGridView() { return !(view === 'discover' || (view === 'shelves' && !drill)); }
function updateViewBar() {
    var btns = document.getElementsByClassName('view-btn');
    for (var i = 0; i < btns.length; i++) btns[i].className = 'view-btn' + (btns[i].getAttribute('data-v') === view ? ' active' : '');
    var sel = $('sort-sel'); if (sel) sel.value = sortBy;
}
function setView(v) {
    view = v; drill = null; activeLetter = ''; discoverState = null;
    updateViewBar(); renderView();
    window.scrollTo(0, 0);
}
function openDrill(kind, key) {
    closeDetail();
    view = 'shelves'; drill = { kind: kind, key: key }; activeLetter = '';
    updateViewBar(); renderView();
    window.scrollTo(0, 0);
}
function closeDrill() { drill = null; updateViewBar(); renderView(); window.scrollTo(0, 0); }
function deleteDrillShelf() {
    if (!drill || drill.kind !== 'shelf') return;
    if (!confirm('Delete shelf "' + drill.key + '"? (The books stay in your library.)')) return;
    delete userData.shelves[drill.key]; saveUser();
    closeDrill();
}
function setSort(v) { sortBy = v; lsSet('reader_sort', v); if (isGridView()) applyFilters(); }
function setLetter(l) { activeLetter = (activeLetter === l) ? '' : l; buildLetterBar(); applyFilters(); }
function buildLetterBar() {
    var h = '', L = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for (var i = 0; i < L.length; i++) h += '<span class="letter' + (activeLetter === L.charAt(i) ? ' active' : '') + '" onclick="setLetter(\'' + L.charAt(i) + '\')">' + L.charAt(i) + '</span>';
    $('letter-list').innerHTML = h;
}

function renderView() {
    var grid = $('book-list'), panel = $('panel');
    var gridMode = isGridView();
    $('filter-bar').style.display = gridMode ? 'block' : 'none';
    $('letter-bar').style.display = (gridMode && view === 'library') ? 'block' : 'none';
    $('drill-bar').style.display = drill ? 'block' : 'none';
    if (drill) {
        $('drill-title').textContent = ({ shelf: 'Shelf', tag: 'Tag', series: 'Series', author: 'Author' }[drill.kind] || '') + ': ' + drill.key;
        $('drill-del').style.display = drill.kind === 'shelf' ? 'inline-block' : 'none';
    }
    if (!gridMode) {
        grid.style.display = 'none'; grid.innerHTML = ''; shownList = []; shownCount = 0;
        panel.style.display = 'block';
        if (view === 'discover') renderDiscover(); else renderShelves();
        return;
    }
    panel.style.display = 'none'; panel.innerHTML = '';
    grid.style.display = 'block';
    if (view === 'library') buildLetterBar();
    applyFilters();
}
function refreshOrganizeUi() {
    if (!isGridView()) renderView();
    var st = $('info-status'); if (st) st.textContent = infoStatusText();
    if (detailId) renderDetail();
}

function recentBooks() {
    var arr = [];
    for (var id in userData.opened) if (has(userData.opened, id)) { var b = getBook(id); if (b) arr.push({ b: b, t: userData.opened[id].t || 0 }); }
    arr.sort(function(x, y) { return y.t - x.t; });
    var out = [];
    for (var i = 0; i < arr.length && i < 60; i++) out.push(arr[i].b);
    return out;
}
function matchDrill(b) {
    if (drill.kind === 'shelf') return inShelf(drill.key, b.id);
    if (drill.kind === 'author') return b.author === drill.key;
    var m = has(metaLite, b.id) ? metaLite[b.id] : null;
    if (!m) return false;
    if (drill.kind === 'series') return m.s === drill.key;
    var ts = tagsOf(b.id), k = drill.key.toLowerCase();
    for (var i = 0; i < ts.length; i++) if (ts[i].toLowerCase() === k) return true;
    return false;
}
function searchHaystack(b) {
    var m = has(metaLite, b.id) ? metaLite[b.id] : null;
    return (b.title + ' ' + b.author + (m ? ' ' + m.t.replace(/\|/g, ' ') + ' ' + m.s : '')).toLowerCase();
}

function applyFilters() {
    if (!isGridView()) { renderView(); return; }
    var q = $('search').value.toLowerCase().replace(/^\s+|\s+$/g, '');
    var base;
    if (view === 'recent' && !drill) base = recentBooks();
    else base = sortedBooks(sortBy);
    var f = [], words = q ? q.split(/\s+/) : [], i, j;
    for (i = 0; i < base.length; i++) {
        var b = base[i];
        if (activeFilter !== 'all' && b.format !== activeFilter) continue;
        if (view === 'favorites' && !drill && !isFav(b.id)) continue;
        if (drill && !matchDrill(b)) continue;
        if (activeLetter && view === 'library' && firstLetter(sortBy === 'author' ? b.author : b.title) !== activeLetter) continue;
        if (words.length) {
            var hay = searchHaystack(b), ok = true;
            for (j = 0; j < words.length; j++) if (hay.indexOf(words[j]) === -1) { ok = false; break; }
            if (!ok) continue;
        }
        f.push(b);
    }
    renderBooks(f);
}
var filterTimer = null;
function debouncedFilter() {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(function() {
        var q = $('search').value;
        if (q && !isGridView()) setView('library');
        else if (q && view === 'recent') applyFilters();
        else applyFilters();
    }, 150);
}
function setFilter(t, b) {
  activeFilter = t;
  var btns = document.getElementsByClassName('filter-btn');
  for (var i=0; i<btns.length; i++) btns[i].className = 'filter-btn';
  b.className = 'filter-btn active';
  applyFilters();
}

// ── CARDS ──
function cardHtml(b) {
    var extra = '';
    if (view === 'recent') { var p = lsGet('readerPct_' + b.id); if (p) extra += '<div class="pct-badge">' + esc(p) + '%</div>'; }
    if (isFav(b.id)) extra += '<div class="fav-mark">★</div>';
    return '<button type="button" class="book-card" data-cover-id="'+esc(b.coverId||'')+'" data-thumb="'+esc(b.thumb||'')+'" ' +
        'data-id="'+esc(b.id)+'" data-title="'+esc(b.title)+'" data-format="'+esc(b.format)+'" onclick="cardClick(this)">' +
        '<div class="book-cover"><div class="cover-placeholder" style="background:hsl('+hueOf(b.title)+',22%,16%);"><div style="font-family:\'Playfair Display\',serif; font-size:13px; color:#e8e0d0;">'+esc(b.title)+'</div><div style="margin-top:8px; font-size:9px;">'+esc(b.author)+'</div></div>' +
        '<div class="format-badge">'+esc(b.format)+'</div><span class="info-btn" onclick="event.stopPropagation(); showDetail(\''+esc(b.id)+'\');">ⓘ</span>' + extra + '</div>' +
        '<div class="book-info"><div class="book-title">'+esc(b.title)+'</div><div class="book-author">'+esc(b.author)+'</div></div></button>';
}
function openById(id) { var b = getBook(id); if (b) { closeDetail(); openBook(b.id, b.title, b.format); } }
function chipHtml(kind, key, count, on) {
    return '<span class="chip' + (on ? ' on' : '') + '" data-kind="' + kind + '" data-k="' + esc(key) + '" onclick="chipClick(this)">' + esc(key) + (count != null ? '<b>' + count + '</b>' : '') + '</span>';
}
function chipClick(el) {
    var kind = el.getAttribute('data-kind'), key = el.getAttribute('data-k');
    if (kind === 'newshelf') { newShelfPrompt(false); return; }
    if (kind === 'more') { moreOpen[key] = !moreOpen[key]; renderShelves(); return; }
    openDrill(kind, key);
}
function newShelfPrompt(addCurrent) {
    var name = makeShelf(prompt('Name for the new shelf:', ''));
    if (!name) return;
    if (addCurrent && detailId) { if (!inShelf(name, detailId)) toggleShelf(name, detailId); renderDetail(); }
    else refreshOrganizeUi();
}

// ── SHELVES VIEW ──
function infoStatusText() {
    var c = infoCounts();
    return 'Info (tags, series, descriptions) for ' + c.have + ' of ' + allBooks.length + ' books.' + (c.eligible ? ' ' + c.eligible + ' more can be fetched.' : '');
}
function renderShelves() {
    var p = $('panel'), h = [], names = shelfNames(), i;
    h.push('<div class="pnl-h" style="margin-top:0">My shelves</div>');
    for (i = 0; i < names.length; i++) h.push(chipHtml('shelf', names[i], userData.shelves[names[i]].length));
    h.push('<span class="chip chip-new" data-kind="newshelf" data-k="" onclick="chipClick(this)">+ New shelf</span>');
    if (!names.length) h.push('<div class="hint">Shelves are yours to make: tap ⓘ on any book to put it on a shelf.</div>');

    var f = facets();
    var sec = function(title, key, list, kind, limit) {
        if (!list.length) return;
        h.push('<div class="pnl-h">' + title + '</div>');
        var n = moreOpen[key] ? list.length : Math.min(limit, list.length);
        for (var j = 0; j < n; j++) h.push(chipHtml(kind, list[j].n, list[j].c));
        if (list.length > limit) h.push('<span class="chip chip-new" data-kind="more" data-k="' + key + '" onclick="chipClick(this)">' + (moreOpen[key] ? 'fewer' : '+' + (list.length - limit) + ' more') + '</span>');
    };
    sec('Tags', 'tags', f.tags, 'tag', 40);
    sec('Series', 'series', f.series, 'series', 30);
    sec('Authors', 'authors', f.authors, 'author', 40);

    h.push('<div class="pnl-h">Book info</div><div class="hint" id="info-status">' + esc(infoStatusText()) + '</div>');
    h.push('<button class="ctrl-btn" onclick="fetchBookInfo()">Fetch book info</button>');
    p.innerHTML = h.join('');
}

// ── DISCOVER VIEW ──
function pickSurprise(exclude) {
    var pool = [], all = [], i;
    for (i = 0; i < allBooks.length; i++) {
        var b = allBooks[i];
        if (exclude && b.id === exclude) continue;
        all.push(b);
        if (!has(userData.opened, b.id)) pool.push(b);
    }
    pool = pool.length ? pool : all;
    return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}
function buildDiscover() {
    var ds = { pick: pickSurprise(null), sections: [] }, i;
    ds.sections.push({ title: 'Random picks', books: sample(allBooks, 12) });
    var unopened = [];
    for (i = 0; i < allBooks.length; i++) if (!has(userData.opened, allBooks[i].id)) unopened.push(allBooks[i]);
    if (unopened.length && unopened.length < allBooks.length) ds.sections.push({ title: 'Never opened', books: sample(unopened, 12) });
    var rec = recentBooks();
    if (rec.length && rec[0].author && rec[0].author !== 'Unknown') {
        var same = [];
        for (i = 0; i < allBooks.length; i++) if (allBooks[i].author === rec[0].author && allBooks[i].id !== rec[0].id) same.push(allBooks[i]);
        if (same.length) ds.sections.push({ title: 'More from ' + rec[0].author, books: sample(same, 12) });
    }
    var tg = facets().tags, elig = [];
    for (i = 0; i < tg.length; i++) if (tg[i].c >= 3) elig.push(tg[i]);
    if (elig.length) {
        var t = elig[Math.floor(Math.random() * elig.length)], withTag = [], k = t.n.toLowerCase();
        for (i = 0; i < allBooks.length; i++) { var ts = tagsOf(allBooks[i].id); for (var j = 0; j < ts.length; j++) if (ts[j].toLowerCase() === k) { withTag.push(allBooks[i]); break; } }
        ds.sections.push({ title: 'Something in “' + t.n + '”', books: sample(withTag, 12), kind: 'tag', key: t.n });
    }
    return ds;
}
function heroHtml(b) {
    var tags = tagsOf(b.id), th = '', i;
    for (i = 0; i < tags.length && i < 5; i++) th += chipHtml('tag', tags[i], null);
    var m = has(metaLite, b.id) ? metaLite[b.id] : null;
    return '<div class="hero"><div class="hero-cover">' + cardHtml(b) + '</div><div class="hero-text">' +
        '<div class="pnl-h" style="margin-top:0">Surprise me</div>' +
        '<div class="hero-title">' + esc(b.title) + '</div><div class="hero-author">' + esc(b.author) + (m && m.s ? ' · ' + esc(m.s) : '') + '</div>' +
        '<div style="margin:0.6rem 0;">' + th + '</div><div id="hero-desc" class="hero-desc"></div>' +
        '<div style="margin-top:1rem;"><button class="ctrl-btn btn-accent" onclick="openById(\'' + esc(b.id) + '\')">Open</button> ' +
        '<button class="ctrl-btn" onclick="anotherPick()">Another</button> <button class="ctrl-btn" onclick="toggleFav(\'' + esc(b.id) + '\'); renderDiscover();">' + (isFav(b.id) ? '★' : '☆') + '</button></div></div></div>';
}
function anotherPick() { if (discoverState) { discoverState.pick = pickSurprise(discoverState.pick ? discoverState.pick.id : null); renderDiscover(); } }
function reshuffle() { discoverState = null; renderDiscover(); }
function renderDiscover() {
    var p = $('panel');
    if (!allBooks.length) { p.innerHTML = '<div class="empty-msg">Your library is empty. Tap ⟲ to load it.</div>'; return; }
    if (!discoverState) discoverState = buildDiscover();
    var ds = discoverState, h = [], i;
    h.push('<div style="text-align:right;"><span class="chip chip-new" onclick="reshuffle()">↻ Shuffle everything</span></div>');
    if (ds.pick) h.push(heroHtml(ds.pick));
    for (i = 0; i < ds.sections.length; i++) {
        var s = ds.sections[i], cards = [];
        for (var j = 0; j < s.books.length; j++) cards.push(cardHtml(s.books[j]));
        h.push('<div class="pnl-h">' + esc(s.title) + (s.kind ? ' <span class="chip chip-new" style="margin:0 0 0 10px;" data-kind="' + s.kind + '" data-k="' + esc(s.key) + '" onclick="chipClick(this)">see all</span>' : '') + '</div><div class="row-scroll">' + cards.join('') + '</div>');
    }
    var c = infoCounts();
    if (c.eligible) h.push('<div class="hint">Discover gets better with book info (tags, series, descriptions). ' + c.eligible + ' books can be fetched: <span class="chip chip-new" onclick="fetchBookInfo()">fetch now</span></div>');
    p.innerHTML = h.join('');
    if (ds.pick) idbGet('meta', ds.pick.id, function(m) {
        var el = $('hero-desc');
        if (el) el.textContent = (m && m.d) ? (m.d.length > 360 ? m.d.substring(0, 360) + '…' : m.d) : '';
    });
    setTimeout(onScrollWork, 50);
}

// ── DETAIL SHEET ──
function showDetail(id) { detailId = id; renderDetail(); $('detail').style.display = 'block'; }
function closeDetail() { detailId = null; var d = $('detail'); if (d) d.style.display = 'none'; }
function detailShelf(el) { toggleShelf(el.getAttribute('data-k'), detailId); renderDetail(); }
function renderDetail() {
    var b = detailId ? getBook(detailId) : null;
    if (!b) { closeDetail(); return; }
    var m = has(metaLite, b.id) ? metaLite[b.id] : null, tags = tagsOf(b.id), h = [], i;
    h.push('<div style="overflow:hidden;"><div id="detail-cover" class="detail-cover"></div><div class="detail-head">' +
        '<div class="hero-title">' + esc(b.title) + '</div><div class="hero-author">' + esc(b.author) + ' · ' + esc(b.format.toUpperCase()) + (m && m.y ? ' · ' + esc(m.y) : '') + '</div>');
    if (m && m.s) h.push('<div style="margin-top:0.6rem;">' + chipHtml('series', m.s, null) + '</div>');
    h.push('<div id="detail-pub" class="hint"></div></div></div>');
    if (tags.length) { h.push('<div style="margin-top:1rem;">'); for (i = 0; i < tags.length; i++) h.push(chipHtml('tag', tags[i], null)); h.push('</div>'); }
    h.push('<div id="detail-desc" class="hero-desc" style="margin-top:0.8rem;"></div>');
    h.push('<div style="margin-top:1rem;"><button class="ctrl-btn btn-accent" onclick="openById(\'' + esc(b.id) + '\')">Open</button> ' +
        '<button class="ctrl-btn" onclick="toggleFav(\'' + esc(b.id) + '\')">' + (isFav(b.id) ? '★ Favorite' : '☆ Favorite') + '</button> ' +
        '<button class="ctrl-btn" onclick="closeDetail()">Close</button></div>');
    h.push('<div class="pnl-h">Shelves</div>');
    var names = shelfNames();
    for (i = 0; i < names.length; i++) h.push('<span class="chip' + (inShelf(names[i], b.id) ? ' on' : '') + '" data-k="' + esc(names[i]) + '" onclick="detailShelf(this)">' + (inShelf(names[i], b.id) ? '✓ ' : '') + esc(names[i]) + '</span>');
    h.push('<span class="chip chip-new" onclick="newShelfPrompt(true)">+ New shelf</span>');
    $('detail-box').innerHTML = h.join('');

    var key = b.coverId ? 'drive_' + b.coverId : b.id;
    var put = function(src) {
        var box = $('detail-cover');
        if (box && detailId === b.id && !box.firstChild) { var im = document.createElement('img'); im.src = src; box.appendChild(im); }
    };
    if (coverMem[key]) put(coverMem[key]);
    else getLocalCover(key, function(d) { if (d) put(d); else if (b.thumb) put(b.thumb.replace(/=s\d+$/, '=s300')); });
    idbGet('meta', b.id, function(mm) {
        var d = $('detail-desc'), pu = $('detail-pub');
        if (d) d.textContent = (mm && mm.d) ? mm.d : (b.metaId || m ? '' : 'No description yet. Open this book once, or use “Fetch book info”.');
        if (pu && mm) pu.textContent = [mm.p, mm.l].filter(function(x) { return x; }).join(' · ');
    });
}

window.onerror = function(msg, url, line) {
  diagLog("JS ERROR: " + msg + " (at " + line + ")", "red");
  var m = document.getElementById('error-monitor');
  if (m) { m.style.display = 'block'; m.innerHTML += '<div>Line ' + line + ': ' + esc(msg) + '</div>'; }
};

window.onload = function() {
  if (consumeOAuthHash()) {
      showApp();
      var c = readLibraryCache();
      if (c) { allBooks = c; applyFilters(); } else loadLibrary(true);
  }
};
document.addEventListener('DOMContentLoaded', function() { updateViewBar(); buildLetterBar(); });
</script>
